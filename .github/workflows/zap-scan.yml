name: OWASP ZAP scans

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: 24

      - name: Install application
        run: npm install

      - name: Start application
        run: nohup npm start > /tmp/juice-shop.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/juice-shop.log
          exit 1

      - name: ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:3000
          cmd_options: '-m 30'
          artifact_name: zap-full-scan
          allow_issue_writing: false

      - name: Preserve full scan report
        run: cp report_md.md zap-full-report.md

      - name: ZAP full API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: swagger.yml
          format: openapi
          cmd_options: '-O http://localhost:3000'
          artifact_name: zap-api-scan
          allow_issue_writing: false

      - name: Publish combined scan reports
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf '# OWASP ZAP scan reports\n\n## Full scan\n\n'
            cat zap-full-report.md
            printf '\n\n## API scan\n\n'
            cat report_md.md
          } > zap-combined-report.md

          issue=$(gh issue list --state all --limit 1000 --json number,title --jq '.[] | select(.title == "ZAP Scan Reports" or .title == "ZAP API Scan Report") | .number' | head -n 1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "ZAP Scan Reports" --body-file zap-combined-report.md
          else
            gh issue create --title "ZAP Scan Reports" --body-file zap-combined-report.md
          fi

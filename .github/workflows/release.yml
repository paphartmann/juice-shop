name: "Release Pipeline"
on:
  push:
    tags:
      - v*
env:
  CYCLONEDX_NPM_VERSION: '^2.0.0||^3.0.0||^4.0.0'   # keep in sync with package.json
  NPM_VERSION: 11.19.1
  TYPESCRIPT_VERSION: '^6.0.3'                      # keep in sync with package.json
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Create Release"
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 #v2.2.2
        with:
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  package:
    needs: create-release
    runs-on: ${{ matrix.os.runner }}
    strategy:
      matrix:
        os:
          - runner: ubuntu-latest
            pckg-os: linux
            cpu-arch: x64
            pckg-format: tgz
          - runner: ubuntu-24.04-arm
            pckg-os: linux
            cpu-arch: arm64
            pckg-format: tgz
          - runner: windows-latest
            pckg-os: win32
            cpu-arch: x64
            pckg-format: zip
          - runner: macos-latest
            pckg-os: darwin
            cpu-arch: arm64
            pckg-format: zip
        node-version: [22, 24, 26]
      fail-fast: false
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Install CLI tools"
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm install -g typescript@${{ env.TYPESCRIPT_VERSION }}
          npm install -g @cyclonedx/cyclonedx-npm@${{ env.CYCLONEDX_NPM_VERSION }}
          npm install -g archiver
      - name: "Set packaging options"
        run: |
          echo "PCKG_OS_NAME=${{ matrix.os.pckg-os }}" >> $GITHUB_ENV
          echo "PCKG_CPU_ARCH=${{ matrix.os.cpu-arch }}" >> $GITHUB_ENV
          echo "PCKG_FORMAT=${{ matrix.os.pckg-format }}" >> $GITHUB_ENV
          echo "PCKG_NODE_VERSION=${{ matrix.node-version }}" >> $GITHUB_ENV
        shell: bash
      - name: "Package application"
        run: |
          npm install --production
          npm run package:ci
      - name: 'Attach packaged archive to tag release'
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 #v2.2.2
        with:
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
